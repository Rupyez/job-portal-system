
server:
  port: 5001

spring:
  application:
    name: job-portal-user-service

  datasource:
    url: jdbc:mysql://localhost:3306/job_portal_user_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
