server:
  port: ${SERVER_PORT:5005}

spring:
  application:
    name: job-preferences-service
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/job_portal_preferences_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

logging:
  level:
    com.jobportal.jobpreferencesservice: INFO
    org.hibernate.SQL: INFO