
server:
  port: ${COMPANY_SERVICE_PORT:5002}

spring:
  application:
    name: company-service

  datasource:
    url: ${COMPANY_DB_URL:jdbc:mysql://localhost:3306/job_portal_company_db}
    username: ${COMPANY_DB_USERNAME}
    password: ${COMPANY_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
